homepage:
    AgreementText: >-
        Je confirme avoir lu ce qui précède et consens à la collecte, au
        traitement et à l’utilisation des renseignements personnels transmis
        lors de l’Enquête.
    ErrorNotAgreed: >-
        Vous devez accepter les conditions d'utilisation pour débuter le
        questionnaire.
    introduction: >-
        <p class="left">Cette <span class="_strong">enquête
        Origine-Destination</span> est une enquête de démonstration conçue pour
        servir de base au développement et aux tests de parcours, de contenu et
        d'interfaces de questionnaires.</p><p class="left">Vous pouvez l'utiliser
        pour explorer l'expérience participant, valider des changements de
        configuration et prototyper de nouveaux comportements de questionnaire
        dans un contexte réaliste.</p><br/><details style="margin-bottom:
        1rem"><summary class="left _strong" style="cursor:
        pointer;">À propos de cette démonstration</summary><ul><li>Cette
        instance est fournie à des fins de développement, d'intégration et de
        démonstration.</li><li>Le questionnaire, les libellés et les
        renseignements collectés sont du contenu d'exemple utilisé pour appuyer
        la conception des enquêtes et le développement de l'application.</li><li>Vous
        pouvez utiliser cette démonstration pour tester la navigation, la
        configuration du ménage, la saisie des déplacements, les règles de
        validation et les autres fonctionnalités du questionnaire.</li></ul></details>
    introductionParagraphTwo: >-
        <p class="left">Cette démonstration peut servir de point de départ à de
        nouvelles enquêtes Origine-Destination et à des travaux de développement
        connexes.</p><br/><p class="left">Adaptez le contenu, la configuration
        et l'image de marque selon les besoins de votre projet, puis utilisez le
        parcours du questionnaire pour valider l'expérience participant de bout
        en bout.</p><p class="center _oblique"
        style="margin: 2rem 0;">Questionnaire de démonstration pour le
        développement et les tests</p>
    start: Débuter
footer: >-
    <div style="display: flex;justify-content: center;">
        <div style="font-size:
        80%;max-width: 700px;margin: 15px;">
            <p><a href="/dist/documents/od_nationale_2025_consent_mtmd_poly_fr.pdf" target="_blank">Information de
                    consentement</a>&nbsp;| <a href="mailto:mobilite@polymtl.ca?subject=Questionnaire%20de%20démonstration"
        target="_blank">Nous joindre par courriel</a></p>
        </div>
    </div>
