homepage:
    AgreementText: >-
        I confirm that I have read the above and consent to the collection,
        processing, and use of the personal information provided during the
        Survey.
    ErrorNotAgreed: In order to start the survey, you must accept the terms of use.
    introduction: >-
        <p class="left">This <span class="_strong">Origin-Destination
        Survey</span> is a demonstration survey intended to serve as a basis for
        developing and testing survey workflows, content, and user interfaces.</p><p
        class="left">You can use it to explore the participant experience,
        validate configuration changes, and prototype new survey behavior in a
        realistic context.</p><br/><details style="margin-bottom:
        1rem"><summary class="left _strong" style="cursor: pointer;">About
        this demo</summary><ul><li>This instance is provided for development,
        integration, and demonstration purposes.</li><li>The questionnaire,
        wording, and collected information are sample content used to support
        survey design and application development.</li><li>You may use this demo
        to test navigation, household setup, trip entry, validation rules, and
        related survey features.</li></ul></details>
    introductionParagraphTwo: >-
        <p class="left">This demo can be reused as a starting point for new
        Origin-Destination surveys and related development work.</p><br/><p
        class="left">Adapt the content, configuration, and branding to match
        the needs of your project, then use the survey flow to validate the
        participant experience end to end.</p><p class="center _oblique"
        style="margin: 2rem 0;">Demo survey for development and testing</p>
    start: Start
footer: >-
    <div style="display: flex;justify-content: center;">
        <div style="font-size:
        80%;max-width: 700px;margin: 15px;">
            <p><a href="/dist/documents/od_nationale_2025_consent_mtmd_poly_en.pdf" target="_blank">Consent
                    Information</a> | <a href="mailto:mobilite@polymtl.ca?subject=Demo%20Survey"
    target="_blank">Contact us by email</a></p>
        </div>
    </div>
